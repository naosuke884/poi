# main への push で本番 (Cloudflare Workers) にデプロイする。
#
# 既定では何もしない (job 全体を `vars.ENABLE_DEPLOY == 'true'` でガードしている)。
# 有効にするには GitHub リポジトリの Settings > Secrets and variables > Actions で
#   - Variables: ENABLE_DEPLOY = true
#   - Secrets:   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# を登録する (手順は README の「本番デプロイ」を参照)。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# デプロイは並列に走らせず、後から来た run で古い run を置き換える
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # デプロイ前にもう一度型を確認しておく (CI と同じ内容)
      - run: npm run typecheck

      # dist/client (アセット) と dist/poi (Worker) を作る。wrangler deploy はビルド済み設定
      # (.wrangler/deploy/config.json) を読むので、必ず deploy の前に build する
      - run: npm run build

      # 本番 D1 にマイグレーションを適用してからデプロイする (スキーマ変更を含む PR が壊れないように)
      - name: Apply D1 migrations (remote)
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
