<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>poi</title>
    <meta name="description" content="書いたことを忘れてくれるメモ帳。書いてから 30 日で全部消えます。" />
    <!-- OGP / Twitter Card: X や Slack などでリンクを貼ったときのカード。og:image は絶対 URL 必須 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="poi" />
    <meta property="og:title" content="poi" />
    <meta property="og:description" content="書いたことを忘れてくれるメモ帳。書いてから 30 日で全部消えます。" />
    <meta property="og:url" content="https://poi.884naoki-dev.workers.dev/" />
    <meta property="og:image" content="https://poi.884naoki-dev.workers.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- PWA: manifest.webmanifest の theme_color と合わせる (Mantine blue.6) -->
    <meta name="theme-color" content="#228be6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="poi" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
