# 依存の更新 PR を Dependabot に作らせる。minor / patch は dev / prod ごとに 1 本の PR にまとめ、major は個別に確認する
# cooldown はリリースから 7 日経った版だけを提案させ、出たばかりの不具合版や乗っ取られたパッケージを避ける (セキュリティアップデートにはかからない)
# vite-plus の更新 PR は、package.json の vite の別名 (npm:@voidzero-dev/vite-plus-core@…、devDependencies と overrides) を
# Dependabot が上げないため版がずれて CI が落ちる。ignore して手で上げるより通知を残したいので、落ちたら別名を同じ版に揃えて main に入れる
# commit-message の prefix は、初期設定の `Bump x from …` では Conventional Commits の形にならないため
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
