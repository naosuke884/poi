# main への push で CI (ci.yml: lint / typecheck / test / build) が成功したら、そのコミットを本番 (Cloudflare Workers) に
# デプロイする。CI が落ちた / キャンセルされたコミットはデプロイしない。
# 手動 (workflow_dispatch) でも main を出せる。その場合は CI を待たないので、ここで同じ確認をしてから出す。
#
# 既定では何もしない (job 全体を `vars.ENABLE_DEPLOY == 'true'` でガードしている)。
# 有効にするには GitHub リポジトリの Settings > Secrets and variables > Actions で
#   - Variables: ENABLE_DEPLOY = true
#   - Secrets:   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# を登録する (手順は README の「本番デプロイ」を参照)。
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# 本番は 1 つなので、ブランチに関わらず直列に走らせる。
# 途中キャンセルすると D1 マイグレーション適用済み・Worker 未デプロイの状態で止まりうるので cancel はしない
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    # CI からは main への push で成功したときだけ (PR の run は除く)。
    # workflow_dispatch で他ブランチから起動しても本番には出さない
    if: >-
      ${{ vars.ENABLE_DEPLOY == 'true' && (
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      # workflow_run の既定のチェックアウトは main の最新なので、CI が通ったコミットそのものを明示する
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # 手動のときは CI を経ていないので、CI と同じ確認をしてから出す
      - if: github.event_name == 'workflow_dispatch'
        run: npm run lint && npm run typecheck && npm test

      # dist/client (アセット) と dist/poi (Worker) を作る。wrangler deploy はビルド済み設定
      # (.wrangler/deploy/config.json) を読むので、必ず deploy の前に build する
      - run: npm run build

      # 本番 D1 にマイグレーションを適用してからデプロイする (スキーマ変更を含む PR が壊れないように)
      - name: Apply D1 migrations (remote)
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
