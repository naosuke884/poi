# PR ごと / main への push ごとに lint と typecheck と単体テストと build を回し、壊れていないことを機械的に確認する。
# a11y job では実際に描画したページを axe で検査し、アクセシビリティ違反があれば落とす。
# `npm run typecheck` は `wrangler types` を含むが、これは wrangler.jsonc からローカルで型を生成するだけなので
# Cloudflare の認証情報は不要 (secrets 無しで動く)。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じ PR / ブランチで新しい push があったら、進行中の古い run はキャンセルする
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # コミットメッセージの lint で push / PR の範囲のコミットを読むため、履歴をすべて取る
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # コミットメッセージの lint (commitlint.config.js)。PR はベースからの差分、push は前回の push からの差分を見る。
      # ブランチを新しく作った push (before が 0 埋め) や force push (before が履歴に無い) では範囲が取れないので、先頭のコミットだけ見る
      - name: commitlint
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            npx commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          elif [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            npx commitlint --last --verbose
          else
            npx commitlint --from "$BEFORE" --to "$AFTER" --verbose
          fi

      # typecheck が wrangler types で worker-configuration.d.ts (gitignore 済み) を作るので、それを読む lint (vp check の型検査) より前に回す
      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

      - run: npm run build

  a11y:
    name: accessibility (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # テストユーザーのセッションに署名する BETTER_AUTH_SECRET だけあればよい (Google OAuth は使わない)。
      # CI の中だけで使う使い捨ての値なので、毎回ランダムに作る
      - name: Create .dev.vars
        run: |
          cp .dev.vars.example .dev.vars
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 32)|" .dev.vars

      - run: npx playwright install --with-deps chromium

      # dev サーバーの起動、ローカル D1 のマイグレーション、テストユーザーのログインは playwright.config.ts / e2e/global-setup.ts が行う
      - run: npm run test:a11y

      # 違反の詳細 (axe の結果 JSON、スクリーンショット、trace) は HTML レポートで見る
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
