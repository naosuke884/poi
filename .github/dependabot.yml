# 依存の更新 PR を Dependabot に作らせる。npm の minor / patch は 1 本の PR にまとめ、major は個別に確認する
# commit-message の prefix は、初期設定の `Bump x from …` では commitlint (Conventional Commits) の形にならないため
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
