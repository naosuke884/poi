# README.md に埋め込んだデモ動画 (GitHub user-attachments) と public/demo.mp4 の内容が
# 一致していることを検証する。user-attachments へのアップロードは GITHUB_TOKEN では
# 行えないため CI では同期せず、ズレたら落として手元での scripts/sync-demo-video.sh の実行を促す。
name: Demo video sync

on:
  pull_request:
    paths:
      - public/demo.mp4
      - README.md
      - scripts/check-demo-video.sh
  push:
    branches: [main]
    paths:
      - public/demo.mp4
      - README.md
      - scripts/check-demo-video.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: demo video sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: ./scripts/check-demo-video.sh
