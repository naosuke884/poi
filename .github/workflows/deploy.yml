# main への push で CI (ci.yml: lint / typecheck / test / build と a11y) が成功したら、そのコミットを本番 (Cloudflare Workers) に
# デプロイする。CI が落ちた / キャンセルされたコミットはデプロイしない。
# 手動 (workflow_dispatch) の経路は置かない: CI を経ずに本番へ出せる抜け道になるため。
# デプロイが失敗したときは、Actions でその run を Re-run すれば同じコミットを出し直せる。
#
# 既定では何もしない (job 全体を `vars.ENABLE_DEPLOY == 'true'` でガードしている)。
# 有効にするには GitHub リポジトリの Settings > Secrets and variables > Actions で
#   - Variables: ENABLE_DEPLOY = true
#   - Secrets:   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# を登録する。API トークンは Cloudflare ダッシュボード > My Profile > API Tokens で、テンプレート
# 「Edit Cloudflare Workers」に D1 の Edit 権限を足して作る。
# D1 の作成や Worker の Secrets の登録は先に手元で済ませておく (wrangler.jsonc の d1_databases のコメント)。
# Worker の Secrets は wrangler secret put で登録済みのものがそのまま使われる (GitHub 側には不要)。
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# 本番は 1 つなので、ブランチに関わらず直列に走らせる。
# 途中キャンセルすると D1 マイグレーション適用済み・Worker 未デプロイの状態で止まりうるので cancel はしない
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: wrangler deploy
    # main への push で成功したときだけ (PR の run は除く)
    if: >-
      ${{ vars.ENABLE_DEPLOY == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      # workflow_run の既定のチェックアウトは main の最新なので、CI が通ったコミットそのものを明示する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # dist/client (アセット) と dist/poi (Worker) を作る。wrangler deploy はビルド済み設定
      # (.wrangler/deploy/config.json) を読むので、必ず deploy の前に build する
      - run: npm run build

      # 本番 D1 にマイグレーションを適用してからデプロイする (スキーマ変更を含む PR が壊れないように)
      - name: Apply D1 migrations (remote)
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # デプロイが成功しても Worker が起動時に落ちていることがある (better-auth の schema 不一致など)。
      # 公開ページと、認証を通る API (未ログインなら 401) が答えるかを見る。切り替わるまでの数秒は 5xx を許してやり直す
      - name: Smoke test
        env:
          ORIGIN: https://poinote.app # shared/site.ts の SITE_ORIGIN
        run: |
          curl -fsS --retry 5 --retry-delay 5 -o /dev/null "$ORIGIN/"
          curl -fsS --retry 5 --retry-delay 5 -o /dev/null "$ORIGIN/api/auth/get-session"
          status=$(curl -sS --retry 5 --retry-delay 5 -o /dev/null -w '%{http_code}' "$ORIGIN/api/board")
          test "$status" = 401 || { echo "::error::/api/board returned $status (expected 401)"; exit 1; }
