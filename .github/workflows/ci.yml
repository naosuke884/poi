# PR ごと / main への push ごとに lint と typecheck と単体テストと build を回し、壊れていないことを機械的に確認する。
# `npm run typecheck` は `wrangler types` を含むが、これは wrangler.jsonc からローカルで型を生成するだけなので
# Cloudflare の認証情報は不要 (secrets 無しで動く)。
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じ PR / ブランチで新しい push があったら、進行中の古い run はキャンセルする
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # コミットメッセージの lint で push / PR の範囲のコミットを読むため、履歴をすべて取る
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      # コミットメッセージの lint (commitlint.config.js)。PR はベースからの差分、push は前回の push からの差分を見る。
      # ブランチを新しく作った push (before が 0 埋め) や force push (before が履歴に無い) では範囲が取れないので、先頭のコミットだけ見る
      - name: commitlint
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            npx commitlint --from "$PR_BASE" --to "$PR_HEAD" --verbose
          elif [ -z "${BEFORE//0/}" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            npx commitlint --last --verbose
          else
            npx commitlint --from "$BEFORE" --to "$AFTER" --verbose
          fi

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
